spring.application.name=mentorhub

spring.datasource.url=jdbc:postgresql://localhost:5432/mentorhub
spring.datasource.username=enterprisedb
spring.datasource.password=ncmmcn

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT (override in production via env)
mentorhub.jwt.secret=${JWT_SECRET:mentorhub-dev-secret-key-change-in-production-min-32-chars}
mentorhub.jwt.expiration-ms=86400000

# File uploads (resource center)
mentorhub.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
